<script type="text/html" data-help-name="svg-chart">
    <p>Gera gráficos dinâmicos e elegantes em formato SVG e Base64 para visualização em Dashboards e Relatórios, <b>sem depender de bibliotecas externas</b>.</p>

    <h3>Entradas</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">array de números | array de objetos</span></dt>
        <dd>Os dados do gráfico. Pode ser um array simples, um array de objetos, ou um formato multi-série.
            <br><i>Exemplo simples:</i>
            <pre>[10, 20, 30]</pre>
            <br><i>Exemplo avançado (Objetos):</i>
            <pre>[
  { "value": 10, "label": "Jan", "color": "#ff0000" },
  { "value": 20, "label": "Fev", "color": "green" }
]</pre>
            <br><i>Exemplo Multi-Série (Para Linhas):</i>
            <pre>[
  {
    "series": "Temp A",
    "color": "#ff0000",
    "data": [22, 24, 23, 26]
  },
  {
    "series": "Temp B",
    "color": "#0000ff",
    "data": [20, 21, 25, 24]
  }
]</pre>
        </dd>
        <dt class="optional">title <span class="property-type">string</span></dt>
        <dd>Substitui o título do gráfico dinamicamente.</dd>
        <dt class="optional">width / height <span class="property-type">number</span></dt>
        <dd>Altera as dimensões do gráfico dinamicamente (em pixels).</dd>
    </dl>

    <h3>Saídas</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string</span></dt>
        <dd>O código fonte XML do SVG gerado. Perfeito para integração direta em Dashboards HTML ou bibliotecas de PDF.</dd>
        <dt>base64 <span class="property-type">string</span></dt>
        <dd>A imagem codificada em Data URI (<code>data:image/svg+xml;base64,...</code>), pronta para ser inserida na tag HTML <code>&lt;img src="..."&gt;</code> ou para envio de e-mails.</dd>
    </dl>

    <h3>Integração com PDFMake</h3>
    <p>O <b>PDFMake</b> possui suporte nativo para renderização vetorial de SVG, o que garante a melhor qualidade de impressão possível sem perder resolução.</p>
    <p>Para adicionar o gráfico gerado em um relatório PDF, conecte a saída deste nó a uma função (<b>Function node</b>) com o seguinte código para construir o seu <code>docDefinition</code>:</p>
    <pre>
var docDefinition = {
    content: [
        // Inserindo o gráfico SVG diretamente via msg.payload
        {
            svg: msg.payload,
        },
    ],
};

msg.payload = docDefinition;
return msg;
    </pre>

    <h3>Dicas de Uso</h3>
    <ul>
        <li><b>Auto-Escala:</b> Deixe os campos Min e Max vazios na configuração para que o nó calcule os limites automaticamente com base nos dados fornecidos.</li>
        <li><b>Suavização:</b> Ative "Suavizar Linhas" para aplicar curvas elegantes de Bezier em gráficos de Linha e Área.</li>
        <li><b>Dashboard UI:</b> Para mostrar na tela, conecte a um nó <code>ui_template</code> e use: <code>&lt;div ng-bind-html="msg.payload"&gt;&lt;/div&gt;</code>.</li>
    </ul>
</script>
